else if(k.startsWith('arrow')&&sel.size){e.preventDefault();const st=sh?10:1;sel.forEach(i=>{const o=O(i);if(k=='arrowleft')o.x-=st;if(k=='arrowright')o.x+=st;if(k=='arrowup')o.y-=st;if(k=='arrowdown')o.y+=st});commit()}});
document.addEventListener('keyup',e=>{if(e.code=='Space')space=false});

/* import + smart grid */
function masonry(os,cx,cy){const n=os.length,cols=Math.max(1,Math.round(Math.sqrt(n))),G=16;os.forEach(o=>{if(o.type=='image'){const k=240/o.w;o.w=240;o.h*=k}});const W=Math.max(240,...os.map(o=>o.w)),hs=Array(cols).fill(0);os.forEach(o=>{const c=hs.indexOf(Math.min(...hs));o.x=c*(W+G)+(W-o.w)/2;o.y=hs[c];o.rot=0;hs[c]+=o.h+G});const tw=cols*(W+G)-G,th=Math.max(...hs)-G;os.forEach(o=>{o.x+=cx-tw/2;o.y+=cy-th/2})}
function gridPlace(items){const os=items.map(l=>{const o=mk('image',0,0,l.w,l.h);o.ref=l.id;o.name=l.title;return o}),[cx,cy]=P(innerWidth/2,innerHeight/2);masonry(os,cx,cy);S.objs.push(...os);sel=new Set(os.map(o=>o.id));commit();fitAll()}
function setS(m){const e=$('#ims');if(e)e.textContent=m}
function importLocal(files){const fs=[...files].filter(f=>f.type.startsWith('image/')),out=[];if(!fs.length)return;let n=0;const cb=l=>{if(l)out.push(l);if(++n==fs.length){if(out.length)gridPlace(out);showImp=false;ui()}};fs.forEach(f=>addFiles([f],null,{m:{title:f.name.replace(/\.[^.]+$/,'')},cb}))}
async function doImport(items){if(!items.length)return;const out=[];setS(tr('importing'));for(const it of items){await new Promise(res=>{const m={m:{title:it.title,src_url:it.page||it.src,desc:it.credit||''},cb:l=>{if(l)out.push(l);res()}};fetch(it.src).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>addFiles([new File([b],'i',{type:b.type||'image/jpeg'})],null,m)).catch(()=>{const im=new Image();im.onload=()=>{const l={id:uid(),src:it.src,title:it.title,desc:it.credit||'',src_url:it.page||it.src,tags:'',cat:'',fav:false,w:im.naturalWidth,h:im.naturalHeight,hot:1};S.lib.unshift(l);out.push(l);res()};im.onerror=()=>res();im.src=it.src})})}
if(out.length){gridPlace(out);impSel=new Set();showImp=false;ui()}else setS(tr('imgErr'))}
const strip=h=>String(h||'').replace(/<[^>]+>/g,'');
async function runSearch(){const k=impQ.trim();if(!k)return;const ik=$('#ik');if(ik){KEYS[impSrc]=ik.value.trim();try{localStorage.setItem('refkeys',JSON.stringify(KEYS))}catch(e){}}const key=KEYS[impSrc];if(['unsplash','pexels','pixabay'].includes(impSrc)&&!key){setS(tr('keyNeed'));return}
setS('…');const e=encodeURIComponent(k);try{let r=[];
if(impSrc=='wiki'){const j=await(await fetch(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch=${e}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1200`)).json();r=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo&&/\.(jpe?g|png|webp)/i.test(p.imageinfo[0].thumburl)).map(p=>{const i=p.imageinfo[0],x=i.extmetadata||{};return{id:String(p.pageid),th:i.thumburl,src:i.thumburl,page:i.descriptionurl,title:p.title.replace(/^File:/,'').replace(/\.\w+$/,''),credit:strip(x.Artist&&x.Artist.value)+' · '+strip(x.LicenseShortName&&x.LicenseShortName.value)+' · Wikimedia Commons'}})}
else if(impSrc=='unsplash'){const j=await(await fetch(`https://api.unsplash.com/search/photos?per_page=24&query=${e}`,{headers:{Authorization:'Client-ID '+key}})).json();r=(j.results||[]).map(p=>({id:p.id,th:p.urls.small,src:p.urls.regular,page:p.links.html,title:p.alt_description||k,credit:p.user.name+' · Unsplash'}))}
else if(impSrc=='pexels'){const j=await(await fetch(`https://api.pexels.com/v1/search?per_page=24&query=${e}`,{headers:{Authorization:key}})).json();r=(j.photos||[]).map(p=>({id:String(p.id),th:p.src.medium,src:p.src.large,page:p.url,title:p.alt||k,credit:p.photographer+' · Pexels'}))}
else if(impSrc=='pixabay'){const j=await(await fetch(`https://pixabay.com/api/?key=${encodeURIComponent(key)}&per_page=24&q=${e}`)).json();r=(j.hits||[]).map(p=>({id:String(p.id),th:p.webformatURL,src:p.largeImageURL,page:p.pageURL,title:p.tags,credit:p.user+' · Pixabay'}))}
impRes=r;impSel=new Set();renderImp();setS(r.length?'':tr('none'))}catch(x){setS(x instanceof TypeError?tr('netErr'):String(x.message||x))}}
function renderImp(){const SRC=[['wiki','Wikimedia'],['unsplash','Unsplash'],['pexels','Pexels'],['pixabay','Pixabay'],['url','URL']],need=['unsplash','pexels','pixabay'].includes(impSrc);
$('#im').innerHTML=`<h3>${tr('imp')}<button data-close>✕</button></h3><div class="row">${SRC.map(([k,n])=>`<button data-isrc="${k}" class="${impSrc==k?'on':''}">${n}</button>`).join('')}</div>`+(impSrc=='url'?`<div class="row"><input id="iu" placeholder="https://…/image.jpg" value="${esc(impU)}" style="flex:1"><button id="iugo" class="pri">${tr('add')}</button></div>`:`<div class="row"><input id="iq" placeholder="${tr('search')}" value="${esc(impQ)}" style="flex:1"><button id="isr" class="pri">${tr('go')}</button></div>`+(need?`<div class="row"><input id="ik" type="password" placeholder="API key" value="${esc(KEYS[impSrc]||'')}" style="flex:1"></div>`:''))+`<div class="row"><button id="ifp">${tr('files')}</button>${[['Pinterest','https://www.pinterest.com/search/pins/?q='],['Behance','https://www.behance.net/search/projects?search='],['Dribbble','https://dribbble.com/search/']].map(([n,u])=>`<a href="${u}${encodeURIComponent(impQ)}" target="_blank" rel="noopener noreferrer"><button>${n} ↗</button></a>`).join('')}</div><div class="empty" style="padding:2px">${tr('impnote')}</div><div id="ims" class="empty" style="padding:2px"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${impRes.map(r=>`<div data-ipick="${esc(r.id)}" title="${esc(r.title)}" style="position:relative;cursor:pointer;border:2px solid ${impSel.has(r.id)?'var(--ac)':'transparent'};border-radius:6px;overflow:hidden"><img src="${esc(r.th)}" alt="${esc(r.title)}" style="width:100%;height:90px;object-fit:cover;display:block"><span style="position:absolute;top:2px;inset-inline-start:4px;background:var(--pn);border-radius:4px;padding:0 3px">${impSel.has(r.id)?'☑':'☐'}</span></div>`).join('')}</div>`+(impRes.length?`<div class="row"><button class="pri" id="iimp">${tr('selImp')} (${impSel.size})</button></div>`:'')}
$('#im').addEventListener('click',e=>{const t=e.target;let b;if(b=t.closest('[data-isrc]')){impSrc=b.dataset.isrc;impRes=[];impSel=new Set();renderImp()}else if(b=t.closest('[data-ipick]')){const id=b.dataset.ipick;impSel.has(id)?impSel.delete(id):impSel.add(id);renderImp()}else if(t.closest('#isr'))runSearch();else if(t.closest('#iugo')){const u=impU.trim();if(/^https?:\/\//.test(u))doImport([{src:u,title:u.split('/').pop().split('?')[0]||'image',page:u}])}else if(t.closest('#iimp'))doImport(impRes.filter(r=>impSel.has(r.id)));else if(t.closest('#ifp'))$('#fi2').click()});
$('#im').addEventListener('input',e=>{if(e.target.id=='iq')impQ=e.target.value;if(e.target.id=='iu')impU=e.target.value});
$('#im').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='iq')runSearch()});
