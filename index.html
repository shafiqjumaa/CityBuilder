<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Builder — Phase 1</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CB</div>
        <div>
          <strong>City Builder</strong>
          <span>Prototype · Phase 1</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">Money</span>
          <strong id="money">$125,430</strong>
        </div>
        <div class="stat">
          <span class="label">Population</span>
          <strong id="population">1,250</strong>
        </div>
        <div class="stat">
          <span class="label">Happiness</span>
          <strong id="happiness">82%</strong>
        </div>
        <div class="stat positive">
          <span class="label">Balance</span>
          <strong id="balance">+$1,240</strong>
        </div>
      </div>
    </header>

    <aside class="left-panel glass">
      <div class="panel-title">City Overview</div>
      <div class="overview-row"><span>City status</span><b class="online">Operational</b></div>
      <div class="overview-row"><span>Land</span><b>2.4 km²</b></div>
      <div class="overview-row"><span>Buildings</span><b id="building-count">0</b></div>
      <div class="overview-row"><span>Roads</span><b id="road-count">0</b></div>
    </aside>

    <div class="toast-stack" id="toast-stack"></div>

    <div class="clock glass">
      <div>
        <span class="label">Simulation</span>
        <strong id="clock-time">08:00</strong>
      </div>
      <div class="date" id="clock-date">Day 1 · Jan 2026</div>
      <div class="clock-controls">
        <button id="pause-btn" title="Pause simulation">Ⅱ</button>
        <button id="play-btn" title="Play simulation">▶</button>
        <button id="fast-btn" title="Fast simulation">▶▶</button>
      </div>
    </div>

    <div class="toolbar glass" id="toolbar">
      <button class="tool active" data-tool="select">
        <span>⌖</span><small>Select</small>
      </button>
      <button class="tool" data-tool="road">
        <span>╱</span><small>Roads</small>
      </button>
      <button class="tool" data-tool="residential">
        <span>R</span><small>Residential</small>
      </button>
      <button class="tool" data-tool="commercial">
        <span>C</span><small>Commercial</small>
      </button>
      <button class="tool" data-tool="industrial">
        <span>I</span><small>Industrial</small>
      </button>
      <button class="tool" data-tool="building">
        <span>⌂</span><small>Buildings</small>
      </button>
      <button class="tool" data-tool="demolish">
        <span>×</span><small>Demolish</small>
      </button>
    </div>

    <div class="hint glass" id="hint">
      <b>Phase 1</b>
      <span>Drag to orbit · Right-drag to pan · Wheel to zoom · WASD to move</span>
    </div>

    <aside class="inspector glass hidden" id="inspector">
      <div class="panel-title">Selection</div>
      <div id="inspector-content"></div>
    </aside>

    <div class="crosshair" id="crosshair"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
