<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Urbanova — City Builder 3D</title>
<link rel="stylesheet" href="style.css" />

<!-- Import map so our ES modules can `import * as THREE from 'three'` -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

  <!-- 3D canvas mounts here -->
  <div id="viewport"></div>

  <!-- ======================= UI LAYER ======================= -->
  <div id="ui-root">

    <!-- Top status bar -->
    <header id="topbar" class="glass">
      <div class="stat" id="stat-money">
        <span class="icon">💰</span>
        <span class="value" id="val-money">$0</span>
      </div>
      <div class="stat" id="stat-population">
        <span class="icon">👥</span>
        <span class="value" id="val-population">0</span>
      </div>
      <div class="stat" id="stat-happiness">
        <span class="icon">😊</span>
        <span class="value" id="val-happiness">--%</span>
      </div>
      <div class="stat" id="stat-income">
        <span class="icon">📈</span>
        <span class="value" id="val-income">+$0</span>
      </div>

      <div class="topbar-spacer"></div>

      <!-- Clock / time controls -->
      <div id="clock-panel" class="stat">
        <span class="icon">📅</span>
        <span class="value" id="val-date">Day 1, Year 1</span>
        <div class="clock-buttons">
          <button id="btn-pause" class="clock-btn active" title="Pause">⏸</button>
          <button id="btn-play" class="clock-btn" title="Play">▶</button>
          <button id="btn-fast" class="clock-btn" title="Fast Forward">▶▶</button>
        </div>
      </div>
    </header>

    <!-- Notification center -->
    <div id="notification-center"></div>

    <!-- Building info panel (hidden by default) -->
    <aside id="info-panel" class="glass hidden">
      <div class="info-header">
        <span id="info-title">Building</span>
        <button id="info-close">✕</button>
      </div>
      <div id="info-body"></div>
    </aside>

    <!-- Mini map -->
    <div id="minimap" class="glass">
      <canvas id="minimap-canvas" width="180" height="180"></canvas>
    </div>

    <!-- Debug overlay (F3) -->
    <div id="debug-panel" class="glass hidden">
      <div>FPS: <span id="dbg-fps">0</span></div>
      <div>Objects: <span id="dbg-objects">0</span></div>
      <div>Triangles: <span id="dbg-triangles">0</span></div>
      <div>Population: <span id="dbg-population">0</span></div>
      <div>Vehicles: <span id="dbg-vehicles">0</span></div>
      <div>Sim Time: <span id="dbg-simtime">0</span></div>
    </div>

    <!-- Bottom toolbar -->
    <footer id="toolbar" class="glass">
      <button class="tool-btn" data-tool="SELECT" title="Select">🖱️<span>Select</span></button>
      <button class="tool-btn" data-tool="ROAD" title="Roads">🛣️<span>Roads</span></button>
      <button class="tool-btn" data-tool="ZONE" title="Zones">🗺️<span>Zones</span></button>
      <button class="tool-btn" data-tool="BUILDING" title="Buildings">🏢<span>Buildings</span></button>
      <button class="tool-btn" data-tool="ELECTRICITY" title="Electricity">⚡<span>Electricity</span></button>
      <button class="tool-btn" data-tool="WATER" title="Water">💧<span>Water</span></button>
      <button class="tool-btn" data-tool="SERVICES" title="Services">🏛️<span>Services</span></button>
      <button class="tool-btn" data-tool="TRANSPORT" title="Transport">🚌<span>Transport</span></button>
      <button class="tool-btn danger" data-tool="DEMOLISH" title="Demolish">💥<span>Demolish</span></button>
    </footer>

    <!-- Sub-toolbar for tool options (zoning colors, building categories, etc.) -->
    <div id="subtoolbar" class="glass hidden"></div>

    <!-- Cost / status tooltip near cursor -->
    <div id="cost-tooltip" class="hidden"></div>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-title">URBANOVA</div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-fill"></div></div>
        <div class="loading-hint">Building your city engine…</div>
      </div>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
